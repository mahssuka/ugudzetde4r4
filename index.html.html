<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>SNAKE — Ретро-аркада</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
      background: #050505;
      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(0, 255, 100, 0.03) 0px,
          rgba(0, 255, 100, 0.03) 1px,
          transparent 1px,
          transparent 3px
        );
      color: #d4ffe0;
      margin: 0;
      min-height: 100vh;
      padding: 30px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    h1 {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 8px;
      margin: 0 0 20px;
      color: #39ff14;
      text-shadow:
        0 0 5px #39ff14,
        0 0 10px #39ff14,
        0 0 20px #39ff14,
        0 0 40px rgba(57, 255, 20, 0.5);
      text-transform: uppercase;
      animation: flicker 3s infinite;
    }

    @keyframes flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
        text-shadow:
          0 0 5px #39ff14,
          0 0 10px #39ff14,
          0 0 20px #39ff14,
          0 0 40px rgba(57, 255, 20, 0.5);
      }
      20%, 22%, 24%, 55% {
        text-shadow: none;
        color: #1a5c0a;
      }
    }

    /* Панель статистики — плоская с неоновой рамкой */
    #info {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding: 14px 24px;
      margin-bottom: 20px;
      background: #0a0f0a;
      border: 2px solid #39ff14;
      border-radius: 0;
      box-shadow:
        0 0 10px rgba(57, 255, 20, 0.5),
        inset 0 0 20px rgba(57, 255, 20, 0.08);
      font-size: 16px;
      color: #a6ffb8;
      min-height: 76px;
      letter-spacing: 1px;
    }

    #appleCounter,
    #trophyCounter,
    #medalCounter,
    #lossCounter {
      background: transparent;
      border: none;
      vertical-align: middle;
      filter: drop-shadow(0 0 4px rgba(57, 255, 20, 0.6));
    }

    #livesLabel {
      margin-left: 4px;
      color: #a6ffb8;
      font-weight: 700;
      text-transform: uppercase;
    }

    #lives {
      display: inline-block;
      font-size: 20px;
      letter-spacing: 4px;
    }

    #lives .heart {
      color: #ff2266;
      text-shadow: 0 0 6px #ff2266, 0 0 12px rgba(255, 34, 102, 0.6);
    }

    #lives .heart.empty {
      color: #2a1a1f;
      text-shadow: none;
    }

    #time {
      color: #39ff14;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 6px #39ff14;
    }

    #time.low {
      color: #ff2266;
      text-shadow: 0 0 8px #ff2266, 0 0 16px rgba(255, 34, 102, 0.7);
      animation: alarm 0.5s infinite;
    }

    @keyframes alarm {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .hidden { display: none !important; }

    /* Игровое поле — чёрное с неоновой рамкой */
    #game {
      background: #000000;
      border: 3px solid #39ff14;
      border-radius: 0;
      box-shadow:
        0 0 15px rgba(57, 255, 20, 0.7),
        0 0 40px rgba(57, 255, 20, 0.3),
        inset 0 0 30px rgba(57, 255, 20, 0.05);
      display: block;
      image-rendering: pixelated;
    }

    /* Кнопки */
    .controls {
      margin-top: 24px;
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 14px 26px;
      font-size: 14px;
      font-weight: 900;
      font-family: inherit;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #39ff14;
      background: transparent;
      border: 2px solid #39ff14;
      border-radius: 0;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow:
        0 0 8px rgba(57, 255, 20, 0.5),
        inset 0 0 8px rgba(57, 255, 20, 0.05);
    }

    #btnNormal {
      color: #39ff14;
      border-color: #39ff14;
    }

    #btnNormal:hover:not(:disabled) {
      background: #39ff14;
      color: #000;
      box-shadow:
        0 0 15px #39ff14,
        0 0 30px rgba(57, 255, 20, 0.6);
    }

    /* Вторая кнопка — розовая, для разнообразия */
    #btnTime {
      color: #ff4de3;
      border-color: #ff4de3;
      box-shadow:
        0 0 8px rgba(255, 77, 227, 0.5),
        inset 0 0 8px rgba(255, 77, 227, 0.05);
    }

    #btnTime:hover:not(:disabled) {
      background: #ff4de3;
      color: #000;
      box-shadow:
        0 0 15px #ff4de3,
        0 0 30px rgba(255, 77, 227, 0.6);
    }

    button:active:not(:disabled) {
      transform: scale(0.96);
    }

    button:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Подсказка — как надпись на аркадном автомате */
    #hint {
      margin-top: 20px;
      font-size: 12px;
      letter-spacing: 1.5px;
      color: #6a8c6f;
      padding: 10px 18px;
      background: #0a0f0a;
      border: 1px solid rgba(57, 255, 20, 0.3);
      text-transform: uppercase;
    }

    #hint kbd {
      display: inline-block;
      padding: 2px 7px;
      margin: 0 2px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 900;
      background: #000;
      border: 1px solid #39ff14;
      color: #39ff14;
      text-shadow: 0 0 4px #39ff14;
    }

    /* Сканлайны поверх всего — эффект старого монитора */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.15) 0px,
          rgba(0, 0, 0, 0.15) 1px,
          transparent 1px,
          transparent 3px
        );
      z-index: 9999;
      opacity: 0.4;
    }
  </style>
</head>
<body>
  <h1>Snake</h1>

  <div id="info">
    <canvas id="appleCounter" width="60" height="60"></canvas>
    <canvas id="trophyCounter" width="60" height="60"></canvas>
    <canvas id="medalCounter" width="60" height="60" class="hidden"></canvas>
    <canvas id="lossCounter"  width="60" height="60" class="hidden"></canvas>

    <span id="livesBlock">
      <span id="livesLabel">Жизни:</span>
      <span id="lives"></span>
    </span>

    <span id="timeBlock" class="hidden">
      &nbsp;|&nbsp;
      Время: <span id="time">?</span> сек
    </span>
  </div>

  <canvas id="game" width="400" height="400"></canvas>

  <div class="controls">
    <button id="btnNormal">Играть обычно</button>
    <button id="btnTime">Играть на время</button>
  </div>

  <div id="hint">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> — движение &nbsp;•&nbsp; <kbd>Пробел</kbd> — пауза
  </div>

  <script>
    // ==== Настройки ====
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const appleCanvas = document.getElementById('appleCounter');
    const appleCtx = appleCanvas.getContext('2d');
    const trophyCanvas = document.getElementById('trophyCounter');
    const trophyCtx = trophyCanvas.getContext('2d');
    const medalCanvas = document.getElementById('medalCounter');
    const medalCtx = medalCanvas.getContext('2d');
    const lossCanvas = document.getElementById('lossCounter');
    const lossCtx = lossCanvas.getContext('2d');

    const timeEl = document.getElementById('time');
    const livesEl = document.getElementById('lives');
    const livesBlock = document.getElementById('livesBlock');
    const timeBlock = document.getElementById('timeBlock');
    const btnNormal = document.getElementById('btnNormal');
    const btnTime = document.getElementById('btnTime');

    const gridSize = 20;
    const cellSize = canvas.width / gridSize;
    const speed = 150;
    const MAX_LIVES = 3;

    const MIN_TARGET = 5;
    const MAX_TARGET = 15;
    const MIN_TIME = 15;
    const MAX_TIME = 30;

    const BEST_KEY   = 'snake_best_score';
    const WINS_KEY   = 'snake_time_wins';
    const LOSSES_KEY = 'snake_time_losses';

    // ==== Состояние игры ====
    let snake;
    let direction;
    let nextDirection;
    let food;
    let score;
    let lives;
    let targetScore;
    let timeLeft;
    let gameOver;
    let won;
    let paused;
    let userPaused;
    let mode;
    let timerId;
    let timerInterval;
    let mouthOpenUntil = 0;
    let swallowed = [];

    let bestScore = 0;
    let wins = 0;
    let losses = 0;
    let newRecord = false;

    // ==== localStorage ====
    function loadBest() {
      const num = parseInt(localStorage.getItem(BEST_KEY), 10);
      bestScore = isNaN(num) ? 0 : num;
    }
    function saveBest(v) { localStorage.setItem(BEST_KEY, String(v)); }

    function loadWins() {
      const num = parseInt(localStorage.getItem(WINS_KEY), 10);
      wins = isNaN(num) ? 0 : num;
    }
    function saveWins(v) { localStorage.setItem(WINS_KEY, String(v)); }

    function loadLosses() {
      const num = parseInt(localStorage.getItem(LOSSES_KEY), 10);
      losses = isNaN(num) ? 0 : num;
    }
    function saveLosses(v) { localStorage.setItem(LOSSES_KEY, String(v)); }

    // ==== Звук ====
    let audioCtx = null;

    function playEatSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        osc.type = 'square';   // квадратная волна — «ретро» звук

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.18, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);

        osc.frequency.setValueAtTime(700, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.13);
      } catch (e) { console.warn(e); }
    }

    function playRecordSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const start = audioCtx.currentTime;
        const notes = [523, 659, 784, 1047];
        const dur = 0.12;

        notes.forEach((freq, i) => {
          const t = start + i * dur;
          const osc = audioCtx.createOscillator();
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, t);

          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(0.15, t + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.9);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + dur);
        });
      } catch (e) { console.warn(e); }
    }

    // ==== Утилиты ====
    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function updateLives() {
      let html = '';
      for (let i = 0; i < MAX_LIVES; i++) {
        html += (i < lives)
          ? '<span class="heart">❤</span>'
          : '<span class="heart empty">❤</span>';
      }
      livesEl.innerHTML = html;
    }

    function updateTime() {
      timeEl.textContent = timeLeft;
      if (timeLeft <= 5) timeEl.classList.add('low');
      else timeEl.classList.remove('low');
    }

    function updateInfoVisibility() {
      if (mode === 'time') {
        timeBlock.classList.remove('hidden');
        medalCanvas.classList.remove('hidden');
        lossCanvas.classList.remove('hidden');
        livesBlock.classList.add('hidden');
        trophyCanvas.classList.add('hidden');
      } else {
        timeBlock.classList.add('hidden');
        medalCanvas.classList.add('hidden');
        lossCanvas.classList.add('hidden');
        livesBlock.classList.remove('hidden');
        trophyCanvas.classList.remove('hidden');
      }
    }

    function setButtonsEnabled(enabled) {
      btnNormal.disabled = !enabled;
      btnTime.disabled = !enabled;
    }

    // ==== Пауза ====
    function togglePause() {
      if (gameOver) return;
      if (paused) return;
      userPaused = !userPaused;
      draw();
    }

    // ==== Управление ====
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'KeyP') {
        e.preventDefault();
        togglePause();
        return;
      }

      if (gameOver) return;
      if (userPaused) return;

      switch (e.code) {
        case 'ArrowUp':    changeDirection({ x: 0, y: -1 }); break;
        case 'ArrowDown':  changeDirection({ x: 0, y: 1 });  break;
        case 'ArrowLeft':  changeDirection({ x: -1, y: 0 }); break;
        case 'ArrowRight': changeDirection({ x: 1, y: 0 });  break;

        case 'KeyW': changeDirection({ x: 0, y: -1 }); break;
        case 'KeyS': changeDirection({ x: 0, y: 1 });  break;
        case 'KeyA': changeDirection({ x: -1, y: 0 }); break;
        case 'KeyD': changeDirection({ x: 1, y: 0 });  break;
      }
    });

    // ==== Утилита: скруглённый прямоугольник ====
    function roundedRect(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.lineTo(x + w - r, y);
      c.quadraticCurveTo(x + w, y, x + w, y + r);
      c.lineTo(x + w, y + h - r);
      c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      c.lineTo(x + r, y + h);
      c.quadraticCurveTo(x, y + h, x, y + h - r);
      c.lineTo(x, y + r);
      c.quadraticCurveTo(x, y, x + r, y);
      c.closePath();
    }

    // ==== Яблоко ====
    function drawRealisticApple(targetCtx, cx, cy, r, text) {
      targetCtx.beginPath();
      targetCtx.arc(cx, cy, r, 0, Math.PI * 2);
      targetCtx.fillStyle = '#ff2266';
      targetCtx.fill();
      targetCtx.lineWidth = 1.5;
      targetCtx.strokeStyle = '#8a0e34';
      targetCtx.stroke();

      targetCtx.beginPath();
      targetCtx.arc(cx - r * 0.35, cy - r * 0.4, r * 0.22, 0, Math.PI * 2);
      targetCtx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      targetCtx.fill();

      targetCtx.beginPath();
      targetCtx.moveTo(cx, cy - r);
      targetCtx.lineTo(cx + r * 0.1, cy - r * 1.35);
      targetCtx.lineWidth = 2.5;
      targetCtx.strokeStyle = '#5d4037';
      targetCtx.lineCap = 'round';
      targetCtx.stroke();
      targetCtx.lineCap = 'butt';

      targetCtx.beginPath();
      targetCtx.ellipse(cx + r * 0.55, cy - r * 1.15, r * 0.45, r * 0.22, Math.PI / 6, 0, Math.PI * 2);
      targetCtx.fillStyle = '#39ff14';
      targetCtx.fill();
      targetCtx.lineWidth = 1;
      targetCtx.strokeStyle = '#1e7d0e';
      targetCtx.stroke();

      targetCtx.beginPath();
      targetCtx.moveTo(cx + r * 0.2, cy - r * 1.2);
      targetCtx.lineTo(cx + r * 0.9, cy - r * 1.1);
      targetCtx.lineWidth = 0.8;
      targetCtx.strokeStyle = '#1e7d0e';
      targetCtx.stroke();

      if (text !== undefined && text !== null && text !== '') {
        targetCtx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        targetCtx.font = 'bold ' + Math.floor(r * 0.95) + 'px "Courier New", monospace';
        targetCtx.textAlign = 'center';
        targetCtx.textBaseline = 'middle';
        targetCtx.shadowColor = 'rgba(0,0,0,0.8)';
        targetCtx.shadowBlur = 3;
        targetCtx.fillText(text, cx, cy + 1);
        targetCtx.shadowBlur = 0;
        targetCtx.textBaseline = 'alphabetic';
      }
    }

    function updateAppleCounter() {
      const text = (mode === 'time')
        ? score + '/' + targetScore
        : String(score);
      appleCtx.clearRect(0, 0, appleCanvas.width, appleCanvas.height);
      drawRealisticApple(appleCtx, 30, 36, 16, text);
    }

    // ==== Кубок ====
    function drawTrophy(targetCtx, cx, cy, r, text) {
      const gold = targetCtx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
      gold.addColorStop(0,    '#39ff14');
      gold.addColorStop(0.5,  '#a6ffb8');
      gold.addColorStop(1,    '#1e7d0e');
      const darkGold = '#0f4d08';

      targetCtx.beginPath();
      targetCtx.arc(cx - r * 0.95, cy - r * 0.2, r * 0.4, -Math.PI / 2, Math.PI / 2);
      targetCtx.lineWidth = 3;
      targetCtx.strokeStyle = gold;
      targetCtx.stroke();
      targetCtx.lineWidth = 0.8;
      targetCtx.strokeStyle = darkGold;
      targetCtx.stroke();

      targetCtx.beginPath();
      targetCtx.arc(cx + r * 0.95, cy - r * 0.2, r * 0.4, Math.PI / 2, -Math.PI / 2, true);
      targetCtx.lineWidth = 3;
      targetCtx.strokeStyle = gold;
      targetCtx.stroke();
      targetCtx.lineWidth = 0.8;
      targetCtx.strokeStyle = darkGold;
      targetCtx.stroke();

      targetCtx.beginPath();
      targetCtx.moveTo(cx - r * 0.75, cy - r * 0.7);
      targetCtx.lineTo(cx + r * 0.75, cy - r * 0.7);
      targetCtx.quadraticCurveTo(cx + r * 0.7, cy + r * 0.4, cx, cy + r * 0.7);
      targetCtx.quadraticCurveTo(cx - r * 0.7, cy + r * 0.4, cx - r * 0.75, cy - r * 0.7);
      targetCtx.closePath();
      targetCtx.fillStyle = gold;
      targetCtx.fill();
      targetCtx.lineWidth = 1;
      targetCtx.strokeStyle = darkGold;
      targetCtx.stroke();

      targetCtx.beginPath();
      targetCtx.ellipse(cx - r * 0.3, cy - r * 0.25, r * 0.15, r * 0.35, 0.15, 0, Math.PI * 2);
      targetCtx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      targetCtx.fill();

      targetCtx.fillStyle = gold;
      targetCtx.fillRect(cx - r * 0.12, cy + r * 0.65, r * 0.24, r * 0.35);
      targetCtx.strokeStyle = darkGold;
      targetCtx.lineWidth = 0.8;
      targetCtx.strokeRect(cx - r * 0.12, cy + r * 0.65, r * 0.24, r * 0.35);

      targetCtx.beginPath();
      targetCtx.moveTo(cx - r * 0.55, cy + r * 1.05);
      targetCtx.lineTo(cx + r * 0.55, cy + r * 1.05);
      targetCtx.lineTo(cx + r * 0.45, cy + r * 0.95);
      targetCtx.lineTo(cx - r * 0.45, cy + r * 0.95);
      targetCtx.closePath();
      targetCtx.fillStyle = gold;
      targetCtx.fill();
      targetCtx.lineWidth = 1;
      targetCtx.strokeStyle = darkGold;
      targetCtx.stroke();

      if (text !== undefined && text !== null && text !== '') {
        targetCtx.fillStyle = '#000';
        targetCtx.font = 'bold ' + Math.floor(r * 0.75) + 'px "Courier New", monospace';
        targetCtx.textAlign = 'center';
        targetCtx.textBaseline = 'middle';
        targetCtx.fillText(text, cx, cy - r * 0.05);
        targetCtx.textBaseline = 'alphabetic';
      }
    }

    function updateTrophyCounter() {
      trophyCtx.clearRect(0, 0, trophyCanvas.width, trophyCanvas.height);
      drawTrophy(trophyCtx, 30, 30, 16, String(bestScore));
    }

    // ==== Медаль ====
    function drawMedal(targetCtx, cx, cy, r, text) {
      targetCtx.beginPath();
      targetCtx.moveTo(cx - r * 0.55, cy - r * 1.35);
      targetCtx.lineTo(cx - r * 0.15, cy - r * 0.6);
      targetCtx.lineTo(cx - r * 0.55, cy - r * 0.5);
      targetCtx.closePath();
      targetCtx.fillStyle = '#4d9fff';
      targetCtx.fill();

      targetCtx.beginPath();
      targetCtx.moveTo(cx + r * 0.55, cy - r * 1.35);
      targetCtx.lineTo(cx + r * 0.15, cy - r * 0.6);
      targetCtx.lineTo(cx + r * 0.55, cy - r * 0.5);
      targetCtx.closePath();
      targetCtx.fillStyle = '#ff2266';
      targetCtx.fill();

      const grad = targetCtx.createRadialGradient(
        cx - r * 0.3, cy - r * 0.3, r * 0.1,
        cx, cy, r * 0.9
      );
      grad.addColorStop(0,   '#ff9f6b');
      grad.addColorStop(0.5, '#ff6b4d');
      grad.addColorStop(1,   '#8d2b00');

      targetCtx.beginPath();
      targetCtx.arc(cx, cy, r * 0.9, 0, Math.PI * 2);
      targetCtx.fillStyle = grad;
      targetCtx.fill();
      targetCtx.lineWidth = 1.2;
      targetCtx.strokeStyle = '#5a1c00';
      targetCtx.stroke();

      targetCtx.beginPath();
      targetCtx.arc(cx, cy, r * 0.72, 0, Math.PI * 2);
      targetCtx.lineWidth = 1;
      targetCtx.strokeStyle = 'rgba(90, 28, 0, 0.6)';
      targetCtx.stroke();

      if (text !== undefined && text !== null && text !== '') {
        targetCtx.fillStyle = '#000';
        targetCtx.font = 'bold ' + Math.floor(r * 0.85) + 'px "Courier New", monospace';
        targetCtx.textAlign = 'center';
        targetCtx.textBaseline = 'middle';
        targetCtx.fillText(text, cx, cy + 1);
        targetCtx.textBaseline = 'alphabetic';
      }
    }

    function updateMedalCounter() {
      medalCtx.clearRect(0, 0, medalCanvas.width, medalCanvas.height);
      drawMedal(medalCtx, 30, 30, 16, String(wins));
    }

    // ==== Череп ====
    function drawSkull(targetCtx, cx, cy, r, text) {
      const bone = targetCtx.createRadialGradient(
        cx - r * 0.3, cy - r * 0.3, r * 0.1,
        cx, cy, r * 0.9
      );
      bone.addColorStop(0,   '#ffffff');
      bone.addColorStop(0.7, '#d0d0d0');
      bone.addColorStop(1,   '#707070');

      targetCtx.beginPath();
      targetCtx.arc(cx, cy - r * 0.15, r * 0.75, 0, Math.PI * 2);
      targetCtx.fillStyle = bone;
      targetCtx.fill();
      targetCtx.lineWidth = 1;
      targetCtx.strokeStyle = '#333';
      targetCtx.stroke();

      targetCtx.beginPath();
      targetCtx.rect(cx - r * 0.5, cy + r * 0.4, r * 1.0, r * 0.35);
      targetCtx.fillStyle = bone;
      targetCtx.fill();
      targetCtx.stroke();

      targetCtx.beginPath();
      targetCtx.arc(cx - r * 0.3, cy - r * 0.2, r * 0.18, 0, Math.PI * 2);
      targetCtx.fillStyle = '#ff2266';
      targetCtx.fill();

      targetCtx.beginPath();
      targetCtx.arc(cx + r * 0.3, cy - r * 0.2, r * 0.18, 0, Math.PI * 2);
      targetCtx.fillStyle = '#ff2266';
      targetCtx.fill();

      targetCtx.beginPath();
      targetCtx.moveTo(cx, cy + r * 0.05);
      targetCtx.lineTo(cx - r * 0.07, cy + r * 0.2);
      targetCtx.lineTo(cx + r * 0.07, cy + r * 0.2);
      targetCtx.closePath();
      targetCtx.fillStyle = '#111';
      targetCtx.fill();

      targetCtx.strokeStyle = '#333';
      targetCtx.lineWidth = 1;
      for (let i = 0; i < 4; i++) {
        const tx = cx - r * 0.3 + i * r * 0.2;
        targetCtx.beginPath();
        targetCtx.moveTo(tx, cy + r * 0.45);
        targetCtx.lineTo(tx, cy + r * 0.7);
        targetCtx.stroke();
      }

      if (text !== undefined && text !== null && text !== '') {
        targetCtx.fillStyle = '#ff2266';
        targetCtx.font = 'bold ' + Math.floor(r * 0.6) + 'px "Courier New", monospace';
        targetCtx.textAlign = 'center';
        targetCtx.textBaseline = 'middle';
        targetCtx.fillText(text, cx, cy - r * 1.05);
        targetCtx.textBaseline = 'alphabetic';
      }
    }

    function updateLossCounter() {
      lossCtx.clearRect(0, 0, lossCanvas.width, lossCanvas.height);
      drawSkull(lossCtx, 30, 32, 16, String(losses));
    }

    // ==== Змейка (квадратная, неоновая) ====
    function drawSnake() {
      const now = performance.now();
      const eating = now < mouthOpenUntil;

      const len = snake.length;

      for (let i = len - 1; i >= 1; i--) {
        const seg = snake[i];
        const px = seg.x * cellSize;
        const py = seg.y * cellSize;

        let scale = 1;
        const fromTail = len - 1 - i;
        if (fromTail === 0) scale = 0.55;
        else if (fromTail === 1) scale = 0.78;

        const size = cellSize * scale + 3;
        const offset = (cellSize - size) / 2;
        const radius = size * 0.25;

        // Неоновый лаймовый цвет с градиентом
        const g = ctx.createLinearGradient(px, py, px, py + cellSize);
        g.addColorStop(0,   '#a6ff5c');
        g.addColorStop(0.5, '#39ff14');
        g.addColorStop(1,   '#1e7d0e');

        roundedRect(ctx, px + offset, py + offset, size, size, radius);
        ctx.fillStyle = g;
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(166, 255, 92, 0.5)';
        ctx.stroke();
      }

      // Голова
      const head = snake[0];
      const hx = head.x * cellSize;
      const hy = head.y * cellSize;
      const hSize = cellSize + 3;
      const hOffset = (cellSize - hSize) / 2;
      const hRadius = hSize * 0.25;

      const headGrad = ctx.createLinearGradient(hx, hy, hx, hy + cellSize);
      headGrad.addColorStop(0,   '#c6ff8f');
      headGrad.addColorStop(0.5, '#39ff14');
      headGrad.addColorStop(1,   '#1e7d0e');

      roundedRect(ctx, hx + hOffset, hy + hOffset, hSize, hSize, hRadius);
      ctx.fillStyle = headGrad;
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#a6ffb8';
      ctx.stroke();

      const centerX = hx + cellSize / 2;
      const centerY = hy + cellSize / 2;

      const dx = direction.x;
      const dy = direction.y;
      const perpX = -dy;
      const perpY = dx;

      // Глаза
      const eyeForward = cellSize * 0.15;
      const eyeSide    = cellSize * 0.22;
      const eyeR       = cellSize * 0.14;
      const pupilR     = eyeR * 0.55;

      for (const s of [-1, 1]) {
        const ex = centerX + dx * eyeForward + perpX * eyeSide * s;
        const ey = centerY + dy * eyeForward + perpY * eyeSide * s;

        ctx.beginPath();
        ctx.arc(ex, ey, eyeR, 0, Math.PI * 2);
        ctx.fillStyle = '#000';
        ctx.fill();
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = '#39ff14';
        ctx.stroke();

        const px1 = ex + dx * eyeR * 0.3;
        const py1 = ey + dy * eyeR * 0.3;

        ctx.beginPath();
        ctx.arc(px1, py1, pupilR, 0, Math.PI * 2);
        ctx.fillStyle = '#39ff14';
        ctx.fill();
      }

      // Рот
      ctx.save();
      ctx.translate(centerX + dx * (cellSize * 0.32), centerY + dy * (cellSize * 0.32));
      ctx.rotate(Math.atan2(dy, dx));

      const mouthW = cellSize * 0.22;
      const mouthH = cellSize * 0.16;

      ctx.beginPath();
      ctx.ellipse(0, 0, mouthH, mouthW, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#ff2266';
      ctx.fill();
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = '#8a0e34';
      ctx.stroke();

      ctx.restore();

      // Язык
      const showTongue = eating || (Math.floor(now / 700) % 2 === 0);
      if (showTongue) {
        const tongueLen = cellSize * (eating ? 0.55 : 0.35);
        const tx = centerX + dx * (cellSize * 0.32);
        const ty = centerY + dy * (cellSize * 0.32);
        const endX = tx + dx * tongueLen;
        const endY = ty + dy * tongueLen;

        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(endX, endY);
        ctx.lineWidth = 2.2;
        ctx.strokeStyle = '#ff2266';
        ctx.lineCap = 'round';
        ctx.stroke();

        const fork = cellSize * 0.10;
        ctx.beginPath();
        ctx.moveTo(endX, endY);
        ctx.lineTo(endX + dx * fork + perpX * fork, endY + dy * fork + perpY * fork);
        ctx.moveTo(endX, endY);
        ctx.lineTo(endX - dx * fork + perpX * fork, endY - dy * fork + perpY * fork);
        ctx.lineWidth = 1.8;
        ctx.strokeStyle = '#ff2266';
        ctx.stroke();
        ctx.lineCap = 'butt';
      }

      // Проглатываемые яблоки
      for (const s of swallowed) {
        if (s.index >= snake.length) continue;
        const seg = snake[s.index];
        const scx = seg.x * cellSize + cellSize / 2;
        const scy = seg.y * cellSize + cellSize / 2;

        const depth = s.index / Math.max(1, snake.length - 1);
        const sr = cellSize * 0.24 * (1 - depth * 0.55);
        if (sr < 1) continue;

        ctx.beginPath();
        ctx.arc(scx, scy, sr, 0, Math.PI * 2);
        ctx.fillStyle = '#ff2266';
        ctx.fill();
        ctx.lineWidth = 0.8;
        ctx.strokeStyle = '#8a0e34';
        ctx.stroke();
      }
    }

    // ==== Инициализация ====
    function resetState() {
      snake = [
        { x: 10, y: 10 },
        { x: 9,  y: 10 },
        { x: 8,  y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      lives = MAX_LIVES;
      mouthOpenUntil = 0;
      newRecord = false;
      swallowed = [];
      userPaused = false;

      if (mode === 'time') {
        targetScore = randInt(MIN_TARGET, MAX_TARGET);
        timeLeft = randInt(MIN_TIME, MAX_TIME);
      } else {
        targetScore = null;
        timeLeft = null;
      }

      gameOver = false;
      won = false;
      paused = false;

      if (mode === 'time') updateTime();
      updateInfoVisibility();
      updateLives();
      updateAppleCounter();
      updateTrophyCounter();
      updateMedalCounter();
      updateLossCounter();
      spawnFood();
    }

    function spawnFood() {
      while (true) {
        const fx = Math.floor(Math.random() * gridSize);
        const fy = Math.floor(Math.random() * gridSize);
        const onSnake = snake.some(seg => seg.x === fx && seg.y === fy);
        if (!onSnake) {
          food = { x: fx, y: fy };
          return;
        }
      }
    }

    function changeDirection(newDir) {
      if (newDir.x === -direction.x && newDir.y === -direction.y) return;
      nextDirection = newDir;
    }

    function respawn() {
      snake = [
        { x: 10, y: 10 },
        { x: 9,  y: 10 },
        { x: 8,  y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      swallowed = [];
      paused = true;
      draw();
      setTimeout(() => { if (!gameOver) paused = false; }, 1000);
    }

    function hitObstacle() {
      if (mode === 'time') {
        endGame(false);
      } else {
        lives -= 1;
        updateLives();
        if (lives <= 0) endGame(false);
        else respawn();
      }
    }

    function tickTimer() {
      if (mode !== 'time') return;
      if (gameOver) return;
      if (paused) return;
      if (userPaused) return;

      timeLeft -= 1;
      updateTime();
      if (timeLeft <= 0) endGame(false);
    }

    function gameLoop() {
      if (paused || gameOver || userPaused) return;

      direction = nextDirection;

      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) {
        hitObstacle();
        return;
      }

      for (let i = 0; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          hitObstacle();
          return;
        }
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 1;
        updateAppleCounter();
        mouthOpenUntil = performance.now() + 250;
        playEatSound();
        swallowed.push({ index: 0 });
        spawnFood();
        if (mode === 'time' && score >= targetScore) {
          endGame(true);
          return;
        }
      } else {
        snake.pop();
      }

      for (let i = swallowed.length - 1; i >= 0; i--) {
        swallowed[i].index += 1;
        if (swallowed[i].index >= snake.length) {
          swallowed.splice(i, 1);
        }
      }

      draw();
    }

    // ==== Отрисовка большого поля ====
    // Чёрный фон с тонкой зелёной сеткой — как у старого монитора.
    function draw() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Неоновая сетка
      ctx.strokeStyle = 'rgba(57, 255, 20, 0.08)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i <= gridSize; i++) {
        ctx.moveTo(i * cellSize, 0);
        ctx.lineTo(i * cellSize, canvas.height);
        ctx.moveTo(0, i * cellSize);
        ctx.lineTo(canvas.width, i * cellSize);
      }
      ctx.stroke();

      const fcx = food.x * cellSize + cellSize / 2;
      const fcy = food.y * cellSize + cellSize / 2;
      drawRealisticApple(ctx, fcx, fcy, cellSize * 0.42, '');

      drawSnake();

      if (paused && !gameOver) {
        ctx.fillStyle = 'rgba(57, 255, 20, 0.9)';
        ctx.font = 'bold 22px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText('READY?', canvas.width / 2, canvas.height / 2);
      }

      if (userPaused && !gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#39ff14';
        ctx.font = 'bold 42px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#39ff14';
        ctx.shadowBlur = 20;
        ctx.fillText('PAUSE', canvas.width / 2, canvas.height / 2 - 10);
        ctx.shadowBlur = 0;
        ctx.font = '14px "Courier New", monospace';
        ctx.fillStyle = '#6a8c6f';
        ctx.fillText('PRESS SPACE TO CONTINUE', canvas.width / 2, canvas.height / 2 + 30);
      }

      if (gameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = 'center';

        if (won) {
          ctx.fillStyle = '#39ff14';
          ctx.font = 'bold 34px "Courier New", monospace';
          ctx.shadowColor = '#39ff14';
          ctx.shadowBlur = 20;
          ctx.fillText('YOU WIN!', canvas.width / 2, canvas.height / 2 - 60);
          ctx.shadowBlur = 0;

          ctx.fillStyle = '#d4ffe0';
          ctx.font = '16px "Courier New", monospace';
          ctx.fillText('Apples: ' + score, canvas.width / 2, canvas.height / 2 - 20);
          ctx.fillText('Time left: ' + timeLeft + 's', canvas.width / 2, canvas.height / 2 + 10);

          ctx.fillStyle = '#ffd54f';
          ctx.font = 'bold 18px "Courier New", monospace';
          ctx.fillText('WINS TOTAL: ' + wins, canvas.width / 2, canvas.height / 2 + 50);

          if (newRecord) {
            ctx.fillStyle = '#ff4de3';
            ctx.font = 'bold 16px "Courier New", monospace';
            ctx.fillText('NEW RECORD: ' + bestScore, canvas.width / 2, canvas.height / 2 + 85);
          }
        } else {
          ctx.fillStyle = '#ff2266';
          ctx.font = 'bold 34px "Courier New", monospace';
          ctx.shadowColor = '#ff2266';
          ctx.shadowBlur = 20;
          ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 60);
          ctx.shadowBlur = 0;

          ctx.fillStyle = '#d4ffe0';
          ctx.font = '16px "Courier New", monospace';

          if (mode === 'time') {
            ctx.fillText('Score: ' + score + ' / ' + targetScore, canvas.width / 2, canvas.height / 2 - 20);
            ctx.fillText(
              timeLeft <= 0 ? 'TIME OUT!' : 'CRASHED!',
              canvas.width / 2, canvas.height / 2 + 10
            );

            ctx.fillStyle = '#ff8a80';
            ctx.font = 'bold 16px "Courier New", monospace';
            ctx.fillText('LOSSES TOTAL: ' + losses, canvas.width / 2, canvas.height / 2 + 50);
          } else {
            ctx.fillText('Apples: ' + score, canvas.width / 2, canvas.height / 2 - 20);
            ctx.fillText('NO LIVES LEFT', canvas.width / 2, canvas.height / 2 + 10);
          }

          if (newRecord) {
            ctx.fillStyle = '#ff4de3';
            ctx.font = 'bold 18px "Courier New", monospace';
            ctx.shadowColor = '#ff4de3';
            ctx.shadowBlur = 15;
            ctx.fillText('NEW RECORD: ' + bestScore, canvas.width / 2, canvas.height / 2 + 85);
            ctx.shadowBlur = 0;
          }
        }
      }
    }

    // ==== Конец игры ====
    function endGame(win) {
      gameOver = true;
      won = win;
      userPaused = false;

      if (mode === 'time') {
        if (win) {
          wins += 1;
          saveWins(wins);
          updateMedalCounter();
        } else {
          losses += 1;
          saveLosses(losses);
          updateLossCounter();
        }
      }

      if (score > bestScore) {
        bestScore = score;
        saveBest(bestScore);
        newRecord = true;
        updateTrophyCounter();
        playRecordSound();
      } else {
        newRecord = false;
      }

      clearInterval(timerId);
      clearInterval(timerInterval);
      draw();
      setButtonsEnabled(true);
    }

    // ==== Запуск игры ====
    function startGame(selectedMode) {
      mode = selectedMode;
      clearInterval(timerId);
      clearInterval(timerInterval);
      resetState();
      draw();
      setButtonsEnabled(false);

      timerId = setInterval(gameLoop, speed);
      if (mode === 'time') {
        timerInterval = setInterval(tickTimer, 1000);
      }
    }

    btnNormal.addEventListener('click', () => startGame('normal'));
    btnTime.addEventListener('click', () => startGame('time'));

    // ==== Первый запуск ====
    loadBest();
    loadWins();
    loadLosses();
    mode = 'normal';
    resetState();
    draw();
    setButtonsEnabled(true);
  </script>
</body>
</html>
